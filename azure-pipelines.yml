trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectDir: 'ClyvoVetApi-main'
  apiProject: 'ClyvoVetApi-main/ClyvoVetApi.csproj'
  testProject: 'ClyvoVetApi-main/ClyvoVetApi.Tests/ClyvoVetApi.Tests.csproj'
  artifactName: 'app'

stages:
  - stage: CI
    displayName: 'CI - Build e Testes'
    jobs:
      - job: BuildTest
        displayName: 'Compilar, testar e publicar'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET 8'
            inputs:
              packageType: 'sdk'
              version: '8.0.x'
          - script: |
              find . -name "*.csproj" -o -name "*.sln"
            displayName: 'Listar projetos'
          - task: DotNetCoreCLI@2
            displayName: 'Restaurar dependências'
            inputs:
              command: 'restore'
              projects: '$(apiProject)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Testes automáticos'
            inputs:
              command: 'test'
              projects: '$(testProject)'
              arguments: '--configuration $(buildConfiguration)'
              testRunTitle: 'Testes ClyvoVet'

          - task: DotNetCoreCLI@2
            displayName: 'Publicar API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(apiProject)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish'
              zipAfterPublish: false
              modifyOutputPath: false

          - script: |
              printf '#!/bin/sh\nexec dotnet ./ClyvoVetApi.dll\n' > $(Build.ArtifactStagingDirectory)/publish/startup.sh
            displayName: 'Gerar startup.sh'

          - task: ArchiveFiles@2
            displayName: 'Compactar aplicação'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
              replaceExistingArchive: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
              artifact: '$(artifactName)'
              publishLocation: 'pipeline'